<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>鬼操作力ゲーム</title>
<style>
  :root {
    --bg: #14161c; --panel: #1f232c; --line: #3a4150; --text: #e8ebf1; --sub: #9aa3b5;
    --accent: #ffcc33; --goal: #3ddc84; --spike: #ff4d5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { overflow: hidden; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  button:active { filter: brightness(1.3); }
  button.primary { background: var(--accent); color: #222; border-color: var(--accent); font-weight: 700; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }

  /* メニュー */
  #menu, #settings { overflow-y: auto; touch-action: pan-y; padding: 16px; align-items: center; }
  .wrap { width: 100%; max-width: 520px; padding-bottom: 40px; }
  h1 { margin: 8px 0 4px; font-size: 28px; letter-spacing: .05em; }
  h1 span { color: var(--accent); }
  .lead { color: var(--sub); margin: 0 0 12px; font-size: 14px; line-height: 1.6; }
  .progress { color: var(--goal); font-size: 13px; margin: 0 0 12px; }
  .group { margin: 18px 0 8px; font-size: 13px; color: var(--accent); letter-spacing: .1em; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .stage-btn { display: flex; width: 100%; text-align: left; align-items: center; gap: 12px; margin-bottom: 8px; padding: 10px 14px; }
  .stage-btn .no { font-size: 20px; font-weight: 800; color: var(--accent); width: 30px; text-align: center; }
  .stage-btn .body { flex: 1; min-width: 0; }
  .stage-btn .name { font-weight: 700; }
  .stage-btn .name i { font-style: normal; color: var(--spike); font-size: 11px; margin-left: 6px; letter-spacing: -1px; }
  .stage-btn .desc { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .stage-btn .best { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--goal); white-space: nowrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .note { color: var(--sub); font-size: 12px; line-height: 1.6; margin-top: 14px; }

  /* 設定 */
  .set-stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .set-stage h3 { margin: 0 0 6px; font-size: 15px; }
  .set-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 13px; }
  .set-item input { width: 90px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; text-align: right; }
  .set-item small { color: var(--sub); display: block; }

  /* ゲーム */
  #game { align-items: center; touch-action: none; }
  #hud { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px; padding: 8px 10px 4px; }
  #hud .title { flex: 1; min-width: 0; }
  #hud .title b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .title small { color: var(--sub); font-size: 11px; display: block; line-height: 1.4; }
  #timer { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; color: var(--accent); min-width: 80px; text-align: right; }
  #hud button { padding: 6px 10px; font-size: 13px; }
  #stageArea { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 4px; }
  canvas { display: block; background: #0d0f14; border: 1px solid var(--line); border-radius: 8px; }
  #pad { display: none; width: 100%; max-width: 520px; padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); }
  body.touch #pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; height: 150px; }
  body.touch #pad.one .pbtn:not([data-k="U"]) { display: none; }
  body.touch #pad.one .pbtn[data-k="U"] { grid-column: 1 / -1; grid-row: 1 / -1; font-size: 30px; }
  body.touch #pad.one > div:not(.pbtn) { display: none; }
  .pbtn { display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; touch-action: none; }
  .pbtn.down { background: var(--accent); color: #222; }
  #keyhint { color: var(--sub); font-size: 11px; padding: 0 10px 8px; text-align: center; }
  body.touch #keyhint { display: none; }

  /* オーバーレイ */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; }
  #overlay.on { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: 100%; max-width: 360px; text-align: center; }
  .card h2 { margin: 0 0 6px; }
  .card .big { font-size: 34px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card p { color: var(--sub); font-size: 13px; line-height: 1.6; margin: 8px 0; }
  .card .row { justify-content: center; }
</style>
</head>
<body>

<!-- ===== メニュー ===== -->
<section id="menu" class="screen on">
  <div class="wrap">
    <h1>鬼<span>操作</span>力ゲーム</h1>
    <p class="lead">玉をゴール(緑の円)まで運ぶだけ。<br>ただし、ステージごとに操作方法がおかしくなります。赤いトゲに触れるとスタートに戻されます。</p>
    <p class="progress" id="progress"></p>
    <div id="stageList"></div>
    <div class="row">
      <button id="btnSettings">⚙ 設定</button>
      <button id="btnResetRec">記録を消す</button>
    </div>
    <p class="note" id="menuNote"></p>
  </div>
</section>

<!-- ===== 設定 ===== -->
<section id="settings" class="screen">
  <div class="wrap">
    <h1>設定</h1>
    <p class="lead">各ステージの数値を変えられます(0 で無効になる項目もあります)。既定値から変えている間は、クリアタイムを記録しません(公平のため)。</p>
    <div id="settingList"></div>
    <div class="row">
      <button class="primary" id="btnSetBack">保存して戻る</button>
      <button id="btnSetDefault">すべて既定値に戻す</button>
    </div>
  </div>
</section>

<!-- ===== ゲーム ===== -->
<section id="game" class="screen">
  <div id="hud">
    <button id="btnMenu" aria-label="メニュー">≡</button>
    <div class="title"><b id="stName"></b><small id="stHint"></small></div>
    <div id="timer">0.00</div>
    <button id="btnRetry" aria-label="やり直し">↺</button>
  </div>
  <div id="stageArea"><canvas id="cv"></canvas></div>
  <div id="keyhint"></div>
  <div id="pad">
    <div></div><div class="pbtn" data-k="U">▲</div><div></div>
    <div class="pbtn" data-k="L">◀</div><div class="pbtn" data-k="D">▼</div><div class="pbtn" data-k="R">▶</div>
  </div>
</section>

<div id="overlay"><div class="card" id="card"></div></div>

<script>

   設定(既定値)。数値はここで変えるか、ゲーム内の「設定」画面で変更できる。
   ===================================================================== */
const CONFIG = {
  world: { w: 400, h: 600 },       // 論理座標の盤面サイズ(縦長: スマホ縦持ち想定)
  ballRadius: 12,
  restitution: 0.45,               // 壁で跳ね返るときの反発係数
  goalRadius: 26,

// 設定画面に出す項目の説明 [名前, 単位・説明]
const PARAM_LABELS = {
  speed:      ['速さ', 'px/秒'],
  accel:      ['加速度', '入力1あたり px/秒²'],

const MODE_ORDER = { accel: 2, jerk: 3, snap: 4 };

     velocity  … 入力 = 速度                    accel … 入力 = 加速度(慣性)

     autorun   … 勝手に前進し続ける。左右で舵を切るだけ
     onebutton … 向きが勝手に回り続ける。ボタンは「推進」だけ
     impulse   … 押した瞬間にだけ弾かれる(連打)
     charge    … 方向キーを押している間溜めて、離すと発射
     spring    … 操作するのは「ひもの端」。玉はばねで引っ張られてくる

*/

/* =====================================================================
   入力(物理方向 U/D/L/R として扱い、ステージ側で意味を付け替える。S = Space)
   ===================================================================== */
const KEYS4 = ['U', 'D', 'L', 'R'];
const held = { U: false, D: false, L: false, R: false, S: false };
const tapped = { U: false, D: false, L: false, R: false };   // 押した瞬間の取りこぼし防止(連打ステージ用)
const KEYS = { ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D', ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', Space: 'S' };

window.addEventListener('keydown', e => {

  if (e.code === 'KeyR') { e.preventDefault(); startStage(game.idx); }

// スマホ用パッド(マルチタッチ対応、指を滑らせても判定)
const touchOwner = new Map(); // pointerId -> key
function padKeyAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.classList.contains('pbtn') ? el.dataset.k : null; }

  for (const k of touchOwner.values()) if (k) held[k] = true;
  for (const k of KEYS4) if (held[k] && !before[k]) tapped[k] = true;

const pad = $('pad');
pad.addEventListener('pointerdown', e => { e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch (_) {} touchOwner.set(e.pointerId, padKeyAt(e.clientX, e.clientY)); refreshPad(); });

/* =====================================================================
   ゲーム本体
   ===================================================================== */
const cv = $('cv'), ctx = cv.getContext('2d');
let scale = 1;
const game = { idx: 0, running: false, raf: 0 };
let trails = [];
const D2R = Math.PI / 180;

function resize() {
  const area = $('stageArea').getBoundingClientRect();
  const W = CONFIG.world.w, H = CONFIG.world.h;
  scale = Math.max(0.1, Math.min((area.width - 8) / W, (area.height - 8) / H));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', () => { if (game.running) resize(); });

function ballSpecs(s) { return s.balls || [{ start: s.start, goal: s.goal }]; }
function newBall(spec, s) {
  return { x: spec.start[0], y: spec.start[1], vx: 0, vy: 0, ax: 0, ay: 0, jx: 0, jy: 0,
           hd: (s.heading0 !== undefined ? s.heading0 : -90) * D2R, anc: [spec.start[0], spec.start[1]], chg: 0, aim: [0, -1] };
}
function resetBalls(g) {
  g.balls = ballSpecs(g.s).map(sp => newBall(sp, g.s));
  g.buf = []; g.dl = [0, 0, false];
  trails = g.balls.map(() => []);
}

function startStage(i) {
  stopGame();
  const s = STAGES[i];
  Object.assign(game, {
    idx: i, s, c: s.ctrl, running: true, cleared: false,
    t: 0, ct: 0, timerOn: false, elapsed: 0, deaths: 0, flash: 0,
    map: null, shufN: 0, shufAt: -9, flipped: false, angle: 0, dAng: 0, dTarget: 0, dNext: 0,
    en: 1, exh: false, seed: (Math.random() * 4294967296) | 0,
    prev: { U: false, D: false, L: false, R: false },
  });
  resetBalls(game);
  $('stName').textContent = `STAGE ${i + 1}: ${s.name}`;
  $('stHint').textContent = s.hint;
  $('keyhint').textContent = s.keys || '移動: ←↑↓→ / WASD ・ やり直し: R ・ メニュー: Esc';
  const one = s.ctrl.mode === 'onebutton';
  $('pad').classList.toggle('one', one);
  document.querySelector('.pbtn[data-k="U"]').textContent = one ? '押す' : '▲';
  $('overlay').classList.remove('on');
  show('game'); resize();
  let last = performance.now();
  const loop = now => {
    if (!game.running) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (let k = 0; k < 4; k++) update(dt / 4);
    draw();
    game.raf = requestAnimationFrame(loop);
  };
  game.raf = requestAnimationFrame(loop);
}
function stopGame() { game.running = false; cancelAnimationFrame(game.raf); }

// 決定的な乱数(状態は game.seed に持つので、先読みのシミュレーションでも複製できる)
function rnd(g) {
  g.seed = (g.seed + 0x6D2B79F5) | 0;

  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

function randomMap(g) {

  do { p = base.slice(); for (let i = 3; i > 0; i--) { const j = Math.floor(rnd(g) * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } }
  while (p.every((v, i) => v[0] === base[i][0] && v[1] === base[i][1]));
  return { U: p[0], R: p[1], D: p[2], L: p[3] };
}
function mapVec(g, k) { const m = g.map || g.s.keymap; return (m && m[k]) || PHYS_VEC[k]; }

function spikeRect(sp, t) {   // [x,y,w,h, 揺れ幅x, 揺れ幅y, 周期秒, 位相]
  if (!sp[6]) return sp;
  const o = Math.sin(t * 2 * Math.PI / sp[6] + (sp[7] || 0));

function circleRect(cx, cy, r, [x, y, w, h]) {

function zoneAt(g, b) {
  const zs = g.s.zones; if (!zs) return null;
  for (const z of zs) if (b.x >= z[0] && b.x <= z[0] + z[2] && b.y >= z[1] && b.y <= z[1] + z[3]) return z[4];
  return null;
}

function update(dt) {
  const g = game, c = g.c, s = g.s, mode = c.mode;
  if (g.cleared) return;
  g.t += dt;

  // --- 物理入力 → 論理ベクトル ---
  let rx = 0, ry = 0, act = false;
  for (const k of KEYS4) if (held[k]) { act = true; const v = mapVec(g, k); rx += v[0]; ry += v[1]; }
  if (held.S && mode === 'onebutton') act = true;
  { const m = Math.hypot(rx, ry); if (m > 1) { rx /= m; ry /= m; } }
  const pressed = [];
  for (const k of KEYS4) { if ((held[k] && !g.prev[k]) || tapped[k]) pressed.push(k); g.prev[k] = held[k]; tapped[k] = false; }

  if (!g.timerOn && act) g.timerOn = true;
  if (g.timerOn) { g.elapsed += dt * 1000; g.ct = g.elapsed / 1000; }

  // --- シャッフル / 反転 / 回転 / ふらつき ---
  if (c.shuffleEvery > 0 && g.timerOn) {
    const n = Math.floor(g.ct / c.shuffleEvery);
    if (n !== g.shufN) { g.shufN = n; g.map = randomMap(g); g.shufAt = g.t; }
  }
  let sign = 1;
  if (c.flipEvery > 0) { g.flipped = g.timerOn && Math.floor(g.ct / c.flipEvery) % 2 === 1; if (g.flipped) sign = -1; }
  let ang = 0;
  if (c.rotSpeed) { g.angle = g.t * c.rotSpeed * D2R; ang += g.angle; }

    g.dNext -= dt;
    if (g.dNext <= 0) { g.dTarget = (rnd(g) * 2 - 1) * c.drunk; g.dNext = 1 / Math.max(0.05, c.drunkRate || 1); }
    g.dAng += (g.dTarget - g.dAng) * (1 - Math.exp(-3 * dt));

  }

  let lock = false;

    else if (act) { g.en -= dt / c.stamina; if (g.en <= 0) { g.en = 0; g.exh = true; } }

  const W = CONFIG.world.w, H = CONFIG.world.h, r = CONFIG.ballRadius;
  const specs = ballSpecs(s);

    if (mode === 'velocity') {

    } else if (MODE_ORDER[mode]) {

    } else if (mode === 'onebutton') {

      b.ax = Math.cos(b.hd) * c.thrust * th; b.ay = Math.sin(b.hd) * c.thrust * th;

    } else if (mode === 'impulse') {

  let all = true;
  g.balls.forEach((b, bi) => {
    const gl = specs[bi].goal;
    b.inGoal = Math.hypot(b.x - gl[0], b.y - gl[1]) < CONFIG.goalRadius - r * 0.3;
    if (!b.inGoal) all = false;

function collide(b, wrap) {
  const g = game, r = CONFIG.ballRadius, e = CONFIG.restitution, W = CONFIG.world.w, H = CONFIG.world.h;

    const nx = Math.max(x, Math.min(b.x, x + w)), ny = Math.max(y, Math.min(b.y, y + h));
    let dx = b.x - nx, dy = b.y - ny; const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) continue;
    let d = Math.sqrt(d2);
    if (d === 0) { // 中心がめり込んだ: 最短の辺へ押し出す
      const opts = [[b.x - x, -1, 0], [x + w - b.x, 1, 0], [b.y - y, 0, -1], [y + h - b.y, 0, 1]].sort((p, q) => p[0] - q[0]);
      dx = opts[0][1]; dy = opts[0][2]; d = 1; b.x = nx; b.y = ny;
    }

    const vn = b.vx * ux + b.vy * uy;
    if (vn < 0) { b.vx -= (1 + e) * vn * ux; b.vy -= (1 + e) * vn * uy; }
  }
}

function respawn() {
  const g = game;
  resetBalls(g);
  g.deaths++; g.flash = 1;
}

function clear() {
  const g = game; g.cleared = true;
  const ms = Math.round(g.elapsed);
  const modified = isModified();
  const prev = records[g.idx];
  let isBest = false;
  if (!modified && (prev == null || ms < prev)) { records[g.idx] = ms; lsSet(LS_REC, records); isBest = true; }
  const last = g.idx === STAGES.length - 1;
  $('card').innerHTML = `
    <h2>クリア!</h2>
    <div class="big">${fmt(ms)}秒</div>
    <p>${modified ? '設定変更中のため記録しません' : isBest ? '🎉 自己ベスト更新!' : 'ベスト: ' + fmt(prev) + '秒'}<br>トゲに当たった回数: ${g.deaths}</p>
    <div class="row">
      ${last ? '' : '<button class="primary" id="ovNext">次へ</button>'}
      <button id="ovRetry">もう一度</button>
      <button id="ovMenu">メニュー</button>
    </div>`;
  $('overlay').classList.add('on');
  if (!last) $('ovNext').onclick = nextStage;
  $('ovRetry').onclick = () => startStage(g.idx);
  $('ovMenu').onclick = () => { stopGame(); $('overlay').classList.remove('on'); renderMenu(); };
}
function nextStage() { if (game.idx < STAGES.length - 1) startStage(game.idx + 1); }

$('btnMenu').onclick = () => { stopGame(); renderMenu(); };
$('btnRetry').onclick = () => startStage(game.idx);

/* ===== 描画 ===== */
function arrow(x, y, dx, dy, color, wdt) {
  const m = Math.hypot(dx, dy); if (m < 1) return;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = wdt;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  const ux = dx / m, uy = dy / m, hs = 6 + wdt;
  ctx.beginPath(); ctx.moveTo(x + dx, y + dy);
  ctx.lineTo(x + dx - ux * hs - uy * hs * 0.6, y + dy - uy * hs + ux * hs * 0.6);
  ctx.lineTo(x + dx - ux * hs + uy * hs * 0.6, y + dy - uy * hs - ux * hs * 0.6);
  ctx.closePath(); ctx.fill();
}
const ZONE_STYLE = {
  fast: ['rgba(255,204,51,.16)', 'ハヤイ ×2'], invert: ['rgba(255,77,94,.16)', '反転'],
  swap: ['rgba(120,180,255,.16)', '縦横入替'], slow: ['rgba(61,220,132,.16)', 'ノロノロ'], ice: ['rgba(150,220,255,.2)', '氷'],
};
const BALL_COLORS = ['#ffffff', '#7fe3ff'];
const GLYPH = { '0,-1': '↑', '1,0': '→', '0,1': '↓', '-1,0': '←' };

function draw() {
  const g = game, s = g.s, c = g.c, W = CONFIG.world.w, H = CONFIG.world.h, r = CONFIG.ballRadius;
  const specs = ballSpecs(s);
  ctx.fillStyle = '#0d0f14'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1a1e27'; ctx.lineWidth = 1;
  for (let x = 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // ゾーン
  if (s.zones) for (const [x, y, w, h, t] of s.zones) {
    const [col, label] = ZONE_STYLE[t];
    ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(232,235,241,.45)'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(label, x + 6, y + 10); ctx.textAlign = 'center';
  }
  // スタート・ゴール
  const pulse = 1 + 0.08 * Math.sin(performance.now() / 200);
  specs.forEach((sp, i) => {
    ctx.strokeStyle = '#3a4150'; ctx.setLineDash([4, 4]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sp.start[0], sp.start[1], r + 6, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    const col = specs.length > 1 ? BALL_COLORS[i] : '#3ddc84', inG = g.balls[i].inGoal;
    ctx.fillStyle = inG ? 'rgba(61,220,132,.45)' : 'rgba(61,220,132,.14)'; ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sp.goal[0], sp.goal[1], CONFIG.goalRadius * pulse, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; ctx.font = 'bold 12px sans-serif'; ctx.fillText('GOAL', sp.goal[0], sp.goal[1]);
  });
  // 壁
  ctx.fillStyle = '#59627a';
  for (const [x, y, w, h] of s.walls) ctx.fillRect(x, y, w, h);
  // トゲ(斜線)
  for (const sp of s.spikes) {
    const [x, y, w, h] = spikeRect(sp, g.t);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = '#5a1820'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#ff4d5e'; ctx.lineWidth = 3;
    for (let k = -h; k < w; k += 10) { ctx.beginPath(); ctx.moveTo(x + k, y + h); ctx.lineTo(x + k + h, y); ctx.stroke(); }
    ctx.restore();
  }
  // 玉
  g.balls.forEach((b, bi) => {
    const col = BALL_COLORS[bi] || '#fff', tr = trails[bi] || (trails[bi] = []);
    const last = tr[tr.length - 1];
    if (last && Math.hypot(last[0] - b.x, last[1] - b.y) > 100) tr.length = 0;   // ワープ時は軌跡を切る
    tr.push([b.x, b.y]); if (tr.length > 40) tr.shift();
    for (let k = 0; k < tr.length; k++) {
      ctx.fillStyle = `rgba(255,204,51,${k / tr.length * 0.35})`;
      ctx.beginPath(); ctx.arc(tr[k][0], tr[k][1], r * k / tr.length, 0, Math.PI * 2); ctx.fill();
    }
    if (c.mode === 'spring') {   // ひも
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.anc[0], b.anc[1]); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.anc[0], b.anc[1], 8, 0, Math.PI * 2); ctx.stroke();
    }
    const offs = s.wrap ? [-W, 0, W] : [0];
    const offsY = s.wrap ? [-H, 0, H] : [0];
    ctx.fillStyle = col;
    for (const ox of offs) for (const oy of offsY) {
      if (ox && Math.abs(b.x + ox - W / 2) > W / 2 + r) continue;
      if (oy && Math.abs(b.y + oy - H / 2) > H / 2 + r) continue;
      ctx.beginPath(); ctx.arc(b.x + ox, b.y + oy, r, 0, Math.PI * 2); ctx.fill();
    }
    // 向き(乗り物系)
    if (['ship', 'autorun', 'onebutton'].includes(c.mode)) {
      ctx.strokeStyle = '#ff4d5e'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + Math.cos(b.hd) * (r + 9), b.y + Math.sin(b.hd) * (r + 9)); ctx.stroke();
    }
    if (c.mode === 'charge') {   // 溜めゲージ + 狙い
      if (b.chg > 0) {
        arrow(b.x, b.y, b.aim[0] * (20 + 70 * b.chg), b.aim[1] * (20 + 70 * b.chg), 'rgba(255,204,51,.95)', 3);
        ctx.fillStyle = '#222'; ctx.fillRect(b.x - 18, b.y + 18, 36, 6);
        ctx.fillStyle = b.chg >= 1 ? '#ff4d5e' : '#ffcc33'; ctx.fillRect(b.x - 18, b.y + 18, 36 * b.chg, 6);
      }
    }
    // 速度・加速度の矢印
    arrow(b.x, b.y, b.vx * 0.25, b.vy * 0.25, 'rgba(120,180,255,.9)', 2);
    if (MODE_ORDER[c.mode]) arrow(b.x, b.y, b.ax * 0.2, b.ay * 0.2, 'rgba(255,120,200,.9)', 2);
  });

  // ---- 補助表示 ----
  if (c.rotSpeed) {   // 「↑キーで進む向き」コンパス
    const cx = 34, cy = 34;
    ctx.fillStyle = 'rgba(31,35,44,.85)'; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill();
    arrow(cx, cy, Math.sin(g.angle) * 20, -Math.cos(g.angle) * 20, '#ffcc33', 3);
    ctx.fillStyle = '#9aa3b5'; ctx.font = '10px sans-serif'; ctx.fillText('↑キー', cx, cy + 36);
  }
  if (c.drunk > 0) {
    const cx = 34, cy = 34, a = g.dAng * D2R;
    ctx.fillStyle = 'rgba(31,35,44,.85)'; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill();
    arrow(cx, cy, Math.sin(a) * 20, -Math.cos(a) * 20, '#ff8c5a', 3);
    ctx.fillStyle = '#9aa3b5'; ctx.font = '10px sans-serif'; ctx.fillText('ずれ', cx, cy + 36);
  }
  if (c.drift > 0) {   // 風向き
    const cx = W - 34, cy = 34, a = (c.driftRot || 0) * g.t * D2R;
    ctx.fillStyle = 'rgba(31,35,44,.85)'; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill();
    arrow(cx - Math.cos(a) * 12, cy - Math.sin(a) * 12, Math.cos(a) * 24, Math.sin(a) * 24, '#8fd0ff', 3);
    ctx.fillStyle = '#9aa3b5'; ctx.font = '10px sans-serif'; ctx.fillText('風', cx, cy + 36);
  }
  if (c.shuffleEvery > 0) {   // 現在のキー割り当て
    const mm = { U: mapVec(g, 'U'), R: mapVec(g, 'R'), D: mapVec(g, 'D'), L: mapVec(g, 'L') };
    const fresh = g.t - g.shufAt < 0.8;
    ctx.fillStyle = 'rgba(31,35,44,.9)'; ctx.fillRect(4, H - 30, 168, 26);
    ctx.strokeStyle = fresh ? '#ff4d5e' : '#3a4150'; ctx.lineWidth = fresh ? 3 : 1; ctx.strokeRect(4, H - 30, 168, 26);
    ctx.fillStyle = fresh ? '#ffcc33' : '#e8ebf1'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`↑→${GLYPH[mm.U]}  ↓→${GLYPH[mm.D]}  ←→${GLYPH[mm.L]}  →→${GLYPH[mm.R]}`, 10, H - 16); ctx.textAlign = 'center';
    if (g.timerOn) {
      const left = c.shuffleEvery - (g.ct % c.shuffleEvery);
      ctx.fillStyle = '#222'; ctx.fillRect(4, H - 36, 168, 4); ctx.fillStyle = left < 1 ? '#ff4d5e' : '#ffcc33'; ctx.fillRect(4, H - 36, 168 * left / c.shuffleEvery, 4);
    }
  }
  if (c.flipEvery > 0 && g.timerOn) {
    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = g.flipped ? '#ff4d5e' : 'rgba(154,163,181,.9)';
    ctx.fillText(g.flipped ? '⚠ 反転中!' : '通常', W / 2, 16);
    const ph = (g.ct % c.flipEvery) / c.flipEvery;
    ctx.fillStyle = '#222'; ctx.fillRect(W / 2 - 40, 28, 80, 4); ctx.fillStyle = g.flipped ? '#ff4d5e' : '#ffcc33'; ctx.fillRect(W / 2 - 40, 28, 80 * (1 - ph), 4);
  }
  if (c.stamina > 0) {
    ctx.fillStyle = '#222'; ctx.fillRect(W / 2 - 60, H - 16, 120, 8);
    ctx.fillStyle = g.exh ? '#ff4d5e' : '#3ddc84'; ctx.fillRect(W / 2 - 60, H - 16, 120 * g.en, 8);
    ctx.fillStyle = '#9aa3b5'; ctx.font = '10px sans-serif'; ctx.fillText(g.exh ? '息切れ中…' : 'スタミナ', W / 2, H - 24);
  }
  if (c.gravity > 0) {
    const dir = (c.gravFlip > 0 && g.timerOn && Math.floor(g.ct / c.gravFlip) % 2 === 1) ? -1 : 1;
    ctx.fillStyle = '#9aa3b5'; ctx.font = 'bold 14px sans-serif';
    ctx.fillText(dir > 0 ? '▼ 重力' : '▲ 重力', W - 36, 20);
    if (c.gravFlip > 0 && g.timerOn) {
      const ph = (g.ct % c.gravFlip) / c.gravFlip;
      ctx.fillStyle = '#222'; ctx.fillRect(W - 66, 32, 60, 4); ctx.fillStyle = ph > 0.7 ? '#ff4d5e' : '#ffcc33'; ctx.fillRect(W - 66, 32, 60 * (1 - ph), 4);
    }
  }
  // 凡例
  ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(120,180,255,.9)';
  ctx.fillText('青: 速度', W - 6, H - 20);
  if (MODE_ORDER[c.mode]) { ctx.fillStyle = 'rgba(255,120,200,.9)'; ctx.fillText('桃: 加速度', W - 6, H - 8); }
  ctx.textAlign = 'center';

  if (!g.timerOn) {
    ctx.fillStyle = 'rgba(232,235,241,.8)'; ctx.font = 'bold 15px sans-serif';
    ctx.fillText('動かすとタイマー開始', W / 2, H / 2);
  }
  if (g.flash > 0) { ctx.fillStyle = `rgba(255,77,94,${g.flash * 0.4})`; ctx.fillRect(0, 0, W, H); g.flash = Math.max(0, g.flash - 0.04); }
  $('timer').textContent = fmt(g.elapsed);
}

renderMenu();

// 自動テスト用フック(画面には影響しない)
window.__oni = { game, held, tapped, STAGES, CONFIG, startStage, update, stopGame };
</script>
