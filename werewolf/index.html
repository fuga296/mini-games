<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d2e">
<title>人狼ゲーム</title>
<style>
  :root {
    --bg: #f4f1ea; --fg: #222; --card: #fff; --muted: #6b6b6b; --line: #ddd6c8;
    --accent: #b0412e; --accent-fg: #fff; --village: #2f6f4f; --wolf: #b0412e; --fox: #b9831f;
    --chip: #efe9dc; --secret: #f6ecd4;
  }
  body.is-night {
    --bg: #15172a; --fg: #e8e6f0; --card: #22253d; --muted: #a3a3bb; --line: #3a3e5e;
    --accent: #c9a64a; --accent-fg: #15172a; --village: #6fc39b; --wolf: #ef7b67; --fox: #e6b955;
    --chip: #2e3252; --secret: #34304a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 16px; line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { margin: 0; font-size: 30px; letter-spacing: .1em; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  h3 { font-size: 16px; margin: 12px 0 6px; }
  h3 small, .hint, .small { color: var(--muted); font-size: 13px; font-weight: normal; }
  h3 small { margin-left: 8px; }
  p { margin: 6px 0; }
  .title { text-align: center; padding: 28px 0 12px; }
  .title .sub { color: var(--muted); }
  .moon { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 10px; background: #c9a64a; box-shadow: inset -14px -6px 0 0 #a8852f; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
  details.card > summary { cursor: pointer; font-weight: bold; }
  .sticky { position: sticky; bottom: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  .btn {
    display: block; width: 100%; min-height: 48px; margin: 6px 0; padding: 10px 14px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--fg);
    font: inherit; font-weight: bold; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 40px; font-size: 14px; font-weight: normal; }
  .btn.danger { color: var(--wolf); }
  .btn:disabled { opacity: .4; cursor: default; }
  .mode { display: block; width: 100%; text-align: left; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); font: inherit; cursor: pointer; }
  .mode b { display: block; font-size: 18px; }
  .mode span { color: var(--muted); font-size: 14px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .seat { width: 24px; text-align: right; color: var(--muted); font-size: 13px; }
  input.name { flex: 1; min-width: 0; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
  .icon { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); font-size: 20px; cursor: pointer; flex: none; }
  .stepper .rname { flex: 1; font-weight: bold; }
  .stepper .num { width: 28px; text-align: center; font-size: 18px; }
  .village { color: var(--village); } .wolf { color: var(--wolf); } .fox { color: var(--fox); }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; font-size: 14px; }
  .check input { width: 20px; height: 20px; }
  .field { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
  .field select { font: inherit; font-size: 14px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); max-width: 60%; }
  .error { color: var(--wolf); font-weight: bold; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 4px; }
  .bar b { flex: 1; font-size: 18px; }
  .bar span { color: var(--muted); font-size: 13px; }
  .bar .menu { width: 40px; height: 40px; }
  .handoff { text-align: center; padding: 34px 14px; }
  .handoff .who { font-size: 32px; font-weight: bold; margin: 4px 0; word-break: break-all; }
  .handoff .step { color: var(--muted); font-size: 13px; }
  .rolecard { text-align: center; padding: 6px 0 8px; border-bottom: 1px dashed var(--line); margin-bottom: 8px; }
  .rname-big { font-size: 34px; font-weight: bold; margin: 2px 0; }
  .rolecard .team { font-weight: bold; }
  .rolecard p { color: var(--fg); }
  .rolecard .small { color: var(--muted); }
  .rolecard.village .rname-big, .rolecard.village .team { color: var(--village); }
  .rolecard.wolf .rname-big, .rolecard.wolf .team { color: var(--wolf); }
  .rolecard.fox .rname-big, .rolecard.fox .team { color: var(--fox); }
  .allies { font-weight: bold; }
  .targets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .target { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--chip); color: var(--fg); font: inherit; font-weight: bold; cursor: pointer; word-break: break-all; }
  .target.on { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
  .result { font-size: 20px; font-weight: bold; padding: 10px; border-radius: 10px; background: var(--secret); text-align: center; }
  .big { font-size: 20px; font-weight: bold; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 14px; }
  .chip em { font-style: normal; font-weight: bold; margin-left: 4px; font-size: 12px; }
  .chip.dead { text-decoration: line-through; opacity: .5; }
  .chip.win::before { content: '★'; color: var(--fox); margin-right: 2px; }
  .log { list-style: none; padding: 0; margin: 6px 0; font-size: 14px; }
  .log li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .log li.secret { background: var(--secret); padding-left: 6px; }
  .log .d { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .log .sub { color: var(--muted); font-size: 12px; padding-left: 12px; }
  .timer { text-align: center; }
  .time { font-size: 56px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .time.low { color: var(--wolf); }
  .timer .btn.small { display: inline-block; width: 48%; }
  .script p, .say { font-size: 15px; }
  .script { border-left: 4px solid var(--accent); }
  .step h3 { margin-top: 0; }
  .announce { text-align: center; padding: 24px 14px; }
  .ballots { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .end { text-align: center; padding: 26px 14px; }
  .end h2 { font-size: 26px; }
  .end.village h2 { color: var(--village); } .end.wolf h2 { color: var(--wolf); } .end.fox h2 { color: var(--fox); }
  .flow, .roles { padding-left: 20px; } .roles li, .flow li { margin: 6px 0; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--card); color: var(--fg); width: 100%; max-width: 560px; max-height: 80vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: 90%; }
  #toast.show { opacity: 1; }
  noscript { display: block; padding: 20px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
<!-- ロジック（画面に依存しない） -->
<script src="core/module.js"></script>
<script src="core/rng.js"></script>
<script src="core/engine.js"></script>
<script src="core/session.js"></script>
<script src="rules/standard.js"></script>
<!-- 文言と画面 -->
<script src="ui/text-ja.js"></script>
<script src="ui/app.js"></script>
</body>
</html>
