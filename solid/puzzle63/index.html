<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>63パズル</title>
<link rel="stylesheet" href="../common/solid.css">
</head>
<body>
<header class="solid-top">
  <a href="../index.html" title="一覧へ">◀</a>
  <h1>63パズル</h1>
  <button id="shuffle" class="solid-btn" title="シャッフル(完成形から逆に動かす)">🔀</button>
  <div class="solid-status"><span id="moves">0 手</span><span id="time">⏱ 0:00</span></div>
  <span class="solid-spacer"></span>
  <button id="settings" class="solid-btn" title="設定">⚙</button>
  <button id="help" class="solid-btn" title="遊び方">?</button>
</header>
<main class="solid-stage" id="stage"><div class="solid-toast" id="toast"></div></main>
<footer class="solid-bottom" id="bottom">
  <div class="solid-row">
    <span class="solid-label">スライド</span>
    <button class="solid-btn" data-dir="-1,0" title="左へ (←/A)">←</button>
    <button class="solid-btn" data-dir="0,1" title="上へ (↑/W)">↑</button>
    <button class="solid-btn" data-dir="0,-1" title="下へ (↓/S)">↓</button>
    <button class="solid-btn" data-dir="1,0" title="右へ (→/D)">→</button>
    <span id="info" class="solid-label" style="margin-left:6px"></span>
  </div>
</footer>
<script src="../common/three.min.js"></script>
<script src="../common/solid.js"></script>
<script src="game.js"></script>
</body>
</html>
