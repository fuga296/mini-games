<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>立体マインスイーパー</title>
<link rel="stylesheet" href="../common/solid.css">
</head>
<body>
<header class="solid-top">
  <a href="../index.html" title="一覧へ">◀</a>
  <h1>立体マインスイーパー</h1>
  <select id="level" class="solid-sel" title="難易度"></select>
  <button id="newgame" class="solid-btn" title="新しいゲーム">↻</button>
  <div class="solid-status"><span id="mines" title="残りの地雷(地雷数−旗)">💣 0</span><span id="time">⏱ 0:00</span></div>
  <span class="solid-spacer"></span>
  <button id="settings" class="solid-btn" title="設定">⚙</button>
  <button id="help" class="solid-btn" title="遊び方">?</button>
</header>
<main class="solid-stage" id="stage"><div class="solid-toast" id="toast"></div></main>
<footer class="solid-bottom" id="bottom">
  <div class="solid-row">
    <span class="solid-label">操作</span>
    <button id="modeOpen" class="solid-btn on" title="タップで開く">⛏ 開く</button>
    <button id="modeFlag" class="solid-btn" title="タップで旗">🚩 旗</button>
    <span id="info" class="solid-label" style="margin-left:6px"></span>
  </div>
</footer>
<script src="../common/three.min.js"></script>
<script src="../common/solid.js"></script>
<script src="game.js"></script>
</body>
</html>
